databases:
  - name: mysite
    databaseName: mysite
    user: mysite
    plan: free

services:
  - type: web
    name: mysite
    runtime: ruby
    plan: free
    buildCommand: "./bin/render-build.sh"
    startCommand: "bundle exec rails db:migrate && bundle exec rails server"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mysite
          property: connectionString
      - key: RAILS_MASTER_KEY
        sync: false
      - key: PAGARME_API_KEY_BRAUNA
        sync: false
      - key: PAGARME_PUBLIC_KEY_BRAUNA
        sync: false
      - key: PAGARME_ACCOUNT_ID_BRAUNA
        sync: false
      - key: PAGARME_API_KEY_SERRA
        sync: false
      - key: PAGARME_PUBLIC_KEY_SERRA
        sync: false
      - key: PAGARME_ACCOUNT_ID_SERRA
        sync: false
      - key: IMPORT_CANCEL_MISSING_RESERVAS
        value: "false"
      - key: WEB_CONCURRENCY
        value: 2 # sensible default
