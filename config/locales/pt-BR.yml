pt-BR:
  activerecord:
    errors:
      models:
        user:
          attributes:
            email:
              taken: "já está em uso"
            password_confirmation:
              confirmation: "não corresponde à senha"
            password:
              blank: "não pode ficar em branco"
              too_short: "é muito curto (mínimo de %{count} caracteres)"
              too_long: "é muito longo (máximo de %{count} caracteres)"
            name:
              blank: "não pode ficar em branco"
              too_short: "é muito curto (mínimo de %{count} caracteres)"
              too_long: "é muito longo (máximo de %{count} caracteres)"
  errors:
    format: "%{attribute} %{message}"
    messages:
      taken: "já está em uso"
      confirmation: "não corresponde"
      blank: "não pode ficar em branco"
      too_short: "é muito curto (mínimo de %{count} caracteres)"
      too_long: "é muito longo (máximo de %{count} caracteres)"
      invalid: "não é válido"
    attributes:
      email:
        taken: "já está em uso"
      password_confirmation:
        confirmation: "não corresponde à senha"
      password:
        blank: "não pode ficar em branco"
        too_short: "é muito curta (mínimo de %{count} caracteres)"
        too_long: "é muito longa (máximo de %{count} caracteres)"
  date:
    formats:
      default: "%d/%m/%Y"
      short: "%d de %B"
      long: "%d de %B de %Y"
    order:
      - :day
      - :month
      - :year
    month_names:
      - ""
      - "Janeiro"
      - "Fevereiro"
      - "Março"
      - "Abril"
      - "Maio"
      - "Junho"
      - "Julho"
      - "Agosto"
      - "Setembro"
      - "Outubro"
      - "Novembro"
      - "Dezembro"
    abbr_month_names:
      - ""
      - "Jan"
      - "Fev"
      - "Mar"
      - "Abr"
      - "Mai"
      - "Jun"
      - "Jul"
      - "Ago"
      - "Set"
      - "Out"
      - "Nov"
      - "Dez"
    # Add day names here
    day_names:
      - "Domingo"
      - "Segunda-feira"
      - "Terça-feira"
      - "Quarta-feira"
      - "Quinta-feira"
      - "Sexta-feira"
      - "Sábado"
    # And abbreviated day names
    abbr_day_names:
      - "Dom"
      - "Seg"
      - "Ter"
      - "Qua"
      - "Qui"
      - "Sex"
      - "Sáb"
  time:
    formats:
      default: "%d/%m/%Y %H:%M"
      short: "%d de %B %H:%M"
      long: "%d de %B de %Y, %H:%M"
  support:
    array:
      words_connector: ", "
      two_words_connector: " e "
      last_word_connector: " e "
  number:
    format:
      separator: ","
      delimiter: "."
    currency:
      format:
        unit: "R$"
        separator: ","
        delimiter: "."
        format: "%u %n"
  helpers:
    submit:
      create: "Criar %{model}"
      update: "Atualizar %{model}"
      submit: "Salvar %{model}"
    label:
      user:
        email: "E-mail"
        password: "Senha"
        password_confirmation: "Confirme sua senha"
        name: "Nome Completo"
